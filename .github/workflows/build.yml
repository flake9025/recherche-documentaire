name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build_test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B verify

  docker_variants:
    runs-on: ubuntu-latest
    needs: build_test
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        scenario:
          - lucene
          - faiss
          - qdrant
          - milvus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Lucene app image
        if: matrix.scenario == 'lucene'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: poc-recherche-documentaire:ci-lucene
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Lucene stack
        if: matrix.scenario == 'lucene'
        run: docker compose -f docker-compose.lucene.yml up -d --build

      - name: Smoke test Lucene stack
        if: matrix.scenario == 'lucene'
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.lucene.yml logs --no-color
          exit 1

      - name: Start FAISS stack
        if: matrix.scenario == 'faiss'
        run: docker compose up -d --build

      - name: Smoke test FAISS stack
        if: matrix.scenario == 'faiss'
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8090/api/faiss/stats; then
              break
            fi
            sleep 5
          done

          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done

          docker compose logs --no-color
          exit 1

      - name: Start Qdrant stack
        if: matrix.scenario == 'qdrant'
        run: docker compose -f docker-compose.qdrant.yml up -d --build

      - name: Smoke test Qdrant stack
        if: matrix.scenario == 'qdrant'
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:6333/collections; then
              break
            fi
            sleep 5
          done

          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done

          docker compose -f docker-compose.qdrant.yml logs --no-color
          exit 1

      - name: Start Milvus stack
        if: matrix.scenario == 'milvus'
        run: docker compose -f docker-compose.milvus.yml up -d --build

      - name: Smoke test Milvus stack
        if: matrix.scenario == 'milvus'
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:9091/healthz; then
              break
            fi
            sleep 5
          done

          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done

          docker compose -f docker-compose.milvus.yml logs --no-color
          exit 1

      - name: Dump Docker state on failure
        if: failure()
        run: |
          docker ps -a || true
          docker compose -f docker-compose.lucene.yml logs --no-color || true
          docker compose logs --no-color || true
          docker compose -f docker-compose.qdrant.yml logs --no-color || true
          docker compose -f docker-compose.milvus.yml logs --no-color || true

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker compose -f docker-compose.lucene.yml down -v || true
          docker compose down -v || true
          docker compose -f docker-compose.qdrant.yml down -v || true
          docker compose -f docker-compose.milvus.yml down -v || true

  docker_image:
    runs-on: ubuntu-latest
    needs: docker_variants
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/poc-recherche-documentaire
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker_faiss_image:
    runs-on: ubuntu-latest
    needs: docker_variants
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/poc-recherche-documentaire-faiss
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push FAISS Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./faiss-service
          file: ./faiss-service/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_nas:
    runs-on: ubuntu-latest
    needs: [docker_variants, docker_image, docker_faiss_image]
    if: github.event_name != 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Notify NAS
        run: |
          curl -X POST "$NAS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"image":"ghcr.io/${{ github.repository_owner }}/poc-recherche-documentaire:latest"}'
        env:
          NAS_WEBHOOK_URL: ${{ secrets.NAS_WEBHOOK_URL }}
