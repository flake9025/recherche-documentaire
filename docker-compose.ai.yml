# Overlay commun : ajouter -f docker-compose.ai.yml au Compose du moteur choisi.
# vLLM / Ollama restent des serveurs d'inference externes, controles par l'operateur.
services:
  ai-cache:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    user: "999:999"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    environment:
      REDIS_PASSWORD: ${APP_AI_CACHE_PASSWORD:?Definir APP_AI_CACHE_PASSWORD pour le cache prive}
    command:
      - sh
      - -ec
      - exec valkey-server --save '' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass "$${REDIS_PASSWORD}"
    tmpfs:
      - /data:uid=999,gid=999,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$${REDIS_PASSWORD}\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:v1.104.2@sha256:3d88bd757134a00e8c00237b85a021ab1f6d54abb9c1df750f411dbe7256a500
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LITELLM_MASTER_KEY: ${APP_AI_GATEWAY_API_KEY:?Definir APP_AI_GATEWAY_API_KEY (au moins 32 caracteres)}
      LITELLM_VLLM_MODEL: hosted_vllm/${APP_AI_VLLM_MODEL:-mistral}
      APP_AI_VLLM_URL: ${APP_AI_VLLM_URL:-http://host.docker.internal:8000/v1}
      APP_AI_VLLM_API_KEY: ${APP_AI_VLLM_API_KEY:?Definir APP_AI_VLLM_API_KEY et activer cette cle sur vLLM}
      LITELLM_OLLAMA_MODEL: ollama_chat/${APP_AI_OLLAMA_MODEL:-mistral}
      APP_AI_OLLAMA_URL: ${APP_AI_OLLAMA_URL:-http://host.docker.internal:11434}
      REDIS_PASSWORD: ${APP_AI_CACHE_PASSWORD:?Definir APP_AI_CACHE_PASSWORD pour le cache prive}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      LITELLM_TELEMETRY: "False"
      LITELLM_LOG: ERROR
    volumes:
      - ./config/litellm.yml:/app/config.yaml:ro
    depends_on:
      ai-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    environment:
      SPRING_PROFILES_INCLUDE: litellm
      APP_AI_ENABLED: ${APP_AI_ENABLED:-true}
      APP_AI_GATEWAY_URL: http://litellm:4000/v1
      APP_AI_GATEWAY_API_KEY: ${APP_AI_GATEWAY_API_KEY:?Definir APP_AI_GATEWAY_API_KEY (au moins 32 caracteres)}
      APP_AI_DEFAULT_MODEL: ${APP_AI_DEFAULT_MODEL:-mistral-local}
      APP_AI_CACHE_ENABLED: ${APP_AI_CACHE_ENABLED:-false}
      APP_AI_CACHE_TTL_SECONDS: ${APP_AI_CACHE_TTL_SECONDS:-60}
      APP_AI_VLLM_MODEL_REVISION: ${APP_AI_VLLM_MODEL_REVISION:-1}
      APP_AI_OLLAMA_MODEL_REVISION: ${APP_AI_OLLAMA_MODEL_REVISION:-1}
    depends_on:
      litellm:
        condition: service_healthy
