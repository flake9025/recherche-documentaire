app:
  ai:
    default-model: ${APP_AI_DEFAULT_MODEL:mistral-local}
    cache-enabled: ${APP_AI_CACHE_ENABLED:false}
    cache-ttl-seconds: ${APP_AI_CACHE_TTL_SECONDS:60}
    models:
      mistral-local:
        provider: LITELLM
        base-url: ${APP_AI_GATEWAY_URL:http://localhost:4000/v1}
        model: mistral-local
        api-key: ${APP_AI_GATEWAY_API_KEY:}
        cache-version: ${APP_AI_VLLM_MODEL_REVISION:1}
      ollama-mistral:
        provider: LITELLM
        base-url: ${APP_AI_GATEWAY_URL:http://localhost:4000/v1}
        model: ollama-mistral
        api-key: ${APP_AI_GATEWAY_API_KEY:}
        cache-version: ${APP_AI_OLLAMA_MODEL_REVISION:1}
