# Integration Qdrant pour le POC recherche documentaire.
#
# Demarre :
#   - qdrant : serveur vectoriel officiel sur le port 6333
#   - app    : application Spring Boot (profil bert) sur le port 8080
#
# Usage :
#   docker compose -f docker-compose.qdrant.yml up --build
#
# Arret :
#   docker compose -f docker-compose.qdrant.yml down
#
# Note : le premier demarrage est lent car Maven telecharge les dependances
# et DJL telecharge le modele sentence-transformers/all-MiniLM-L6-v2 au
# premier appel d'indexation.

services:

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Active le pipeline d'indexation et de recherche BERT.
      SPRING_PROFILES_ACTIVE: bert
      # Redirige le store d'embeddings vers Qdrant.
      APP_EMBEDDINGS_STORE_DEFAULT: qdrant
      APP_EMBEDDINGS_STORE_QDRANT_ENABLED: "true"
      APP_EMBEDDINGS_STORE_QDRANT_BASE_URL: http://qdrant:6333
      APP_EMBEDDINGS_STORE_QDRANT_COLLECTION: document-embeddings
    volumes:
      # Persistance des documents et de la base H2 entre les redemarrages.
      - ./storage:/app/storage
      - ./lucene-suggest:/app/lucene-suggest
      # Cache du modele DJL/HuggingFace pour eviter un re-telechargement.
      - djl-cache:/root/.djl.ai
    depends_on:
      - qdrant

volumes:
  # Cache persistant du modele sentence-transformers entre les builds.
  djl-cache:
  # Donnees persistantes Qdrant.
  qdrant-storage:


